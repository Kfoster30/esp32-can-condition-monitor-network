[platformio]
default_envs = esp32dev_sensor_sim, esp32dev_dashboard

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1

[env:esp32dev_sensor_sim]
build_flags =
  ${env.build_flags}
  -D ECU_ROLE_SENSOR=1
  -D SENSOR_SIMULATION=1

[env:esp32dev_dashboard]
build_flags =
  ${env.build_flags}
  -D ECU_ROLE_DASHBOARD=1
