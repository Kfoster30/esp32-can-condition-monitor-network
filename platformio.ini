[platformio]
default_envs = esp32dev_sensor_sim, esp32dev_dashboard

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=1

[env:esp32dev_sensor_sim]
build_flags =
  ${env.build_flags}
  -D ECU_ROLE_SENSOR=1
  -D SENSOR_SIMULATION=1

; First hardware channel: DHT11 temperature on GPIO4; other channels stay SIM.
[env:esp32dev_sensor_dht11]
lib_deps =
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
build_flags =
  ${env.build_flags}
  -D ECU_ROLE_SENSOR=1
  -D SENSOR_SIMULATION=1
  -D SENSOR_DHT11=1

; Combined hardware temperature and LED-branch power; motion/condition stay SIM.
[env:esp32dev_sensor_dht11_ina219]
lib_deps =
  ${env:esp32dev_sensor_dht11.lib_deps}
build_flags =
  ${env:esp32dev_sensor_dht11.build_flags}
  -D SENSOR_INA219=1

[env:esp32dev_dashboard]
build_flags =
  ${env.build_flags}
  -D ECU_ROLE_DASHBOARD=1

[env:esp32dev_sensor_dht11_ina219_mpu6050]
extends = env:esp32dev_sensor_dht11_ina219
build_flags =
  ${env:esp32dev_sensor_dht11_ina219.build_flags}
  -D SENSOR_MPU6050=1

; Bench A/B only. INA219 stays wired and is reported unavailable.
[env:esp32dev_mpu6050_can_isolation]
extends = env:esp32dev_sensor_dht11_ina219_mpu6050
build_flags =
  ${env:esp32dev_sensor_dht11_ina219_mpu6050.build_flags}
  -D BENCH_INA219_IDLE=1

; Bench comparison within one boot: keep CAN active and start DHT after 90 s.
[env:esp32dev_mpu6050_dht_isolation]
extends = env:esp32dev_mpu6050_can_isolation
build_flags =
  ${env:esp32dev_mpu6050_can_isolation.build_flags}
  -D BENCH_DHT11_DELAY_MS=90000

; Bench comparison within one boot: start CAN transmission after 90 s.
[env:esp32dev_mpu6050_tx_isolation]
extends = env:esp32dev_sensor_dht11_ina219_mpu6050
build_flags =
  ${env:esp32dev_sensor_dht11_ina219_mpu6050.build_flags}
  -D BENCH_CAN_DELAY_MS=90000

; Same delay comparison, with shared I2C paused during each CAN TX batch.
[env:esp32dev_mpu6050_tx_serialized]
extends = env:esp32dev_mpu6050_tx_isolation
build_flags =
  ${env:esp32dev_mpu6050_tx_isolation.build_flags}
  -D BENCH_SERIALIZE_CAN_I2C=1

; Temporary sensor-board wiring diagnostic, not a CAN telemetry firmware.
; VIN+/VIN- stay disconnected. No INA219 measurement/configuration is written.
[env:esp32dev_ina219_check]
build_src_filter =
  -<*>
  +<Ina219Check.cpp>
build_flags =
  ${env.build_flags}
  -D INA219_WIRING_CHECK=1

; Separate sensor-only measurement diagnostic for the verified resistor/LED
; branch. Writes calibration/configuration, but does not run CAN or DHT.
[env:esp32dev_ina219_measure]
build_src_filter =
  -<*>
  +<Ina219Measure.cpp>
build_flags =
  ${env.build_flags}
  -D INA219_MEASUREMENT_CHECK=1

; Shared sensor I2C communication only: MPU WHO_AM_I plus INA config reads.
; No CAN/DHT, device configuration writes, calibration writes, or motion data.
[env:esp32dev_mpu6050_check]
build_src_filter =
  -<*>
  +<Mpu6050Check.cpp>
build_flags =
  ${env.build_flags}
  -D MPU6050_WIRING_CHECK=1

; Standalone acceleration/tilt check, not CAN vibration telemetry.
; Configures only MPU6050; INA219 remains physically attached but untouched.
[env:esp32dev_mpu6050_measure]
build_src_filter =
  -<*>
  +<Mpu6050Measure.cpp>
build_flags =
  ${env.build_flags}
  -D MPU6050_MEASUREMENT_CHECK=1

; Reuse the same acquisition path for a standalone motion-window check.
[env:esp32dev_mpu6050_motion_check]
extends = env:esp32dev_mpu6050_measure
build_flags =
  ${env:esp32dev_mpu6050_measure.build_flags}
  -D MPU6050_MOTION_CHECK=1
